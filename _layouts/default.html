<!doctype html>
{%- assign lang = page.lang | default: "en" %}
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | Junhyun Chae</title>
  <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 200 | escape }}">
  <meta name="theme-color" content="#f6f6f2">
  <meta property="og:title" content="{{ page.title | escape }} | Junhyun Chae">
  <meta property="og:type" content="article">
  <meta property="og:image" content="https://junhyunchae.github.io/assets/img/portrait.jpg">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Inter+Tight:wght@500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v=c5">
</head>
<body>
  <div class="page">
    <header class="bar">
      <a class="name" href="{% if lang == 'ja' %}{{ '/ja/' | relative_url }}{% else %}{{ '/' | relative_url }}{% endif %}">{% if lang == 'ja' %}チェ・ジュンヒョン{% else %}Junhyun Chae{% endif %}</a>
      <nav aria-label="Main">
        {%- if lang == 'ja' %}
        <a href="{{ '/ja/#work' | relative_url }}">仕事</a>
        <a href="{{ '/ja/#research' | relative_url }}">研究</a>
        <a class="lang" href="{{ '/writing/' | relative_url }}">記事</a>
        {%- else %}
        <a href="{{ '/#work' | relative_url }}">Work</a>
        <a href="{{ '/#research' | relative_url }}">Research</a>
        <a class="lang" href="{{ '/writing/' | relative_url }}">Writing</a>
        {%- endif %}
      </nav>
    </header>

    <main>
{{ content }}
    </main>

    <footer>
      <span>© 2026 Junhyun Chae</span>
      <span>Tokyo</span>
    </footer>
  </div>
</body>
</html>
