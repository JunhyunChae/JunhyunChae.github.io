---
layout: default
---
<article class="article">
  <span class="mono">{{ page.date | date: "%b %-d, %Y" }}</span>
  <h1>{{ page.title }}</h1>
{{ content }}
  <p class="line-links back"><a href="{{ '/writing/' | relative_url }}">{% if page.lang == 'ja' %}すべての記事{% else %}All posts{% endif %}</a></p>
</article>
