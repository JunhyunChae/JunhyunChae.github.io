title: Junhyun Chae
url: https://junhyun-chae.github.io
description: >-
  Junhyun Chae is a blockchain engineer in Tokyo building digital asset custody
  for financial institutions, with a research background in cross-country systemic risk.
timezone: Asia/Tokyo
